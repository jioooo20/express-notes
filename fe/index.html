<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Document</title>
</head>

<body>
    <div class="container mx-auto p-4">
        <div class="row">
            <div class="col-md-6">
                <h1>Tambah Catatan</h1>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <form id="form-catatan">
                    <div class="mb-3">
                        <label for="judul" class="form-label">Masukkan Judul</label>
                        <input type="text" class="form-control" id="judul" placeholder="Masukkan Judul...">
                    </div>
                    <div class="mb-3">
                        <label for="isi" class="form-label">Masukkan isi</label>
                        <input type="text" class="form-control" id="isi" placeholder="Masukkan Catatan...">
                    </div>
                    <button type="submit" class="btn btn-primary">Submit</button>
                </form>
            </div>
        </div>

        <br>
        <div class="daftar-catatan"></div>
    </div>

    <script src="./script.js"></script>
</body>

</html>
